name: Owner password reset security
on:
  pull_request:
    paths:
      - 'apps/api/vitest.staff-native.config.ts'
      - '.github/workflows/password-reset-security.yml'
      - 'apps/api/src/auth/**'
      - 'apps/api/src/agents/credential-database.ts'
      - 'apps/api/src/routes/auth.ts'
      - 'apps/api/vitest.password-reset.config.ts'
      - 'apps/api/scripts/check-reset-migration.mjs'
      - 'packages/config/**'
      - 'packages/database/**'
      - 'pnpm-lock.yaml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reset:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        postgres: ['13', '16', '18']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-reset-ci-password
          POSTGRES_DB: playqube_scheduled_throwaway
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:disposable-reset-ci-password@127.0.0.1:5432/playqube_scheduled_throwaway
      SCHEDULED_NATIVE_DB_ACK: throwaway
      NODE_ENV: test
      LOG_PRETTY: 'false'
      JWT_ACCESS_SECRET: isolated-recovery-access-test-secret
      JWT_REFRESH_SECRET: isolated-recovery-refresh-test-secret
      PASSWORD_RESET_SECRET: isolated-owner-reset-only-test-secret
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install and build packages
        run: |
          corepack enable
          corepack prepare pnpm@8.15.9 --activate
          pnpm install --frozen-lockfile
          pnpm build:packages
      - name: Hostile default grants on disposable database
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE ROLE reset_untrusted NOLOGIN; ALTER DEFAULT PRIVILEGES GRANT ALL ON TABLES TO reset_untrusted; ALTER DEFAULT PRIVILEGES GRANT ALL ON FUNCTIONS TO reset_untrusted;'
          if [ '${{ matrix.postgres }}' != '13' ]; then
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'ALTER DEFAULT PRIVILEGES GRANT ALL ON SCHEMAS TO reset_untrusted;'
          fi
      - name: Migration and actual auth/reset regressions
        run: |
          pnpm --filter @socialplay/database exec prisma migrate deploy
          pnpm --filter api exec vitest run --config vitest.password-reset.config.ts
          node apps/api/scripts/check-reset-migration.mjs
      - name: Preserved monitoring and provider contracts
        if: matrix.postgres == '16'
        run: pnpm --filter api exec vitest run --config vitest.monitoring.config.ts
      - name: Types
        if: matrix.postgres == '16'
        run: |
          pnpm --filter @socialplay/config typecheck
          pnpm --filter api typecheck
