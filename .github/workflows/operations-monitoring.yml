name: Read-only operations monitoring
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/operations-monitoring.yml'
      - 'apps/api/src/monitoring/**'
      - 'apps/api/src/server.ts'
      - 'apps/api/src/providers/softaggregator/callback-routes.ts'
      - 'apps/api/vitest.monitoring.config.ts'
permissions:
  contents: read
jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install pinned dependencies
        run: |
          corepack enable
          corepack prepare pnpm@8.15.9 --activate
          pnpm install --frozen-lockfile
          pnpm build:packages
      - name: Read-only enforcement, privacy, lifecycle and provider/support regressions
        run: |
          pnpm --filter api exec vitest run --config vitest.monitoring.config.ts
          pnpm --filter api typecheck
          pnpm --filter api build
