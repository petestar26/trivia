name: Casino catalogue and launches
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/casino-catalogue.yml'
      - 'apps/api/src/providers/softaggregator/**'
      - 'apps/api/src/scripts/provider-test-probe.ts'
      - 'apps/web/src/pages/games/provider*'
      - 'apps/web/src/pages/casino/**'
      - 'apps/web/src/lib/i18n/catalogues/casino-catalogue.ts'
      - 'apps/web/src/lib/use-favorite-games*'
      - 'scripts/review-casino-preview.mjs'
permissions:
  contents: read
jobs:
  casino:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install pinned dependencies
        run: |
          corepack enable
          corepack prepare pnpm@8.15.9 --activate
          pnpm install --frozen-lockfile
          pnpm build:packages
      - name: Provider, wallet isolation, categories and launch protection
        run: |
          pnpm --filter api typecheck
          pnpm --filter api test:provider-demo
          pnpm --filter web typecheck
          pnpm --filter web exec vitest run src/pages/games/provider-test.test.tsx src/pages/casino/casino.test.tsx src/lib/use-favorite-games.test.tsx src/lib/i18n/style-contract.test.ts --minWorkers=1 --maxWorkers=1
          node apps/web/src/lib/i18n/tools/coverage.mjs --strict
      - name: Production builds and gateway
        env:
          NODE_ENV: production
        run: |
          pnpm --filter api build
          pnpm --filter web build
          pnpm --filter web exec node --test pwa.test.mjs app-recovery.test.mjs server.test.mjs
      - name: All languages and narrow layouts with synthetic games
        run: |
          npm install --prefix "$RUNNER_TEMP/casino-browser" --no-save --package-lock=false playwright@1.58.2
          node "$RUNNER_TEMP/casino-browser/node_modules/playwright/cli.js" install --with-deps chromium
          pnpm --filter web exec vite preview --host 127.0.0.1 --port 4178 --strictPort > "$RUNNER_TEMP/casino-preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4178/ >/dev/null && break; sleep 1; done
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/casino-browser/node_modules/playwright" CASINO_REVIEW_BROWSER_CHANNEL=chromium CASINO_REVIEW_ORIGIN=http://127.0.0.1:4178 CASINO_REVIEW_OUTPUT="$RUNNER_TEMP/casino-evidence" node scripts/review-casino-preview.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: casino-browser-evidence
          path: ${{ runner.temp }}/casino-evidence
          if-no-files-found: ignore
