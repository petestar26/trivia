name: Scheduled rounds PostgreSQL

on:
  pull_request:
    paths:
      - '.github/workflows/scheduled-rounds.yml'
      - 'apps/api/src/games/economics/**'
      - 'apps/api/src/games/scheduled/**'
      - 'apps/api/src/routes/games.ts'
      - 'apps/api/src/server.ts'
      - 'apps/api/tsconfig.json'
      - 'apps/api/scripts/check-shared-types.mjs'
      - 'apps/api/package.json'
      - 'apps/api/src/economy/**'
      - 'apps/web/src/pages/games/spin-win*'
      - 'apps/web/src/lib/spin-proof-verifier*'
      - 'apps/web/src/lib/spin-publication-archive*'
      - 'apps/web/src/test/spin-publication-fixture.ts'
      - 'apps/api/src/scripts/publication-receipt-verify.ts'
      - 'apps/api/build.js'
      - 'apps/web/src/App.tsx'
      - 'packages/shared/src/**'
      - 'apps/api/src/scripts/scheduled-practice-worker.ts'
      - 'apps/api/src/scripts/house-round-recovery.ts'
      - 'apps/api/src/scripts/ledger-runtime-access.ts'
      - 'apps/api/src/ledger/ledger-upgrade.migration.test.ts'
      - 'apps/api/vitest.scheduled-*.config.ts'
      - 'packages/database/prisma/**'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-rounds-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  postgres:
    strategy:
      fail-fast: false
      matrix:
        version: [13, 16]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:${{ matrix.version }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-ci-password
          POSTGRES_DB: playqube_scheduled_throwaway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:isolated-ci-password@127.0.0.1:5432/playqube_scheduled_throwaway?schema=public
      SCHEDULED_NATIVE_DB_ACK: throwaway
      NODE_ENV: test
      LOG_PRETTY: 'false'
      JWT_ACCESS_SECRET: disposable-scheduled-ci-access-secret
      JWT_REFRESH_SECRET: disposable-scheduled-ci-refresh-secret
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install pinned workspace dependencies
        run: |
          corepack enable
          corepack prepare pnpm@8.15.9 --activate
          pnpm install --frozen-lockfile
      - name: Build workspace packages
        run: pnpm build:packages
      - name: Check API shared declaration boundary
        run: pnpm --filter api typecheck:shared-boundary
      - name: Fresh migration deployment and replay
        run: |
          pnpm --filter @socialplay/database db:migrate:deploy
          pnpm --filter @socialplay/database db:migrate:deploy
      - name: Economics and embedded SQL contracts
        run: |
          # The dormant RFC 3161 core uses real offline CMS/TSA fixtures.
          openssl version
          pnpm --filter api test:economics
          pnpm --filter api test:scheduled-practice
      - name: Native two-connection runtime tests
        run: pnpm --filter api exec vitest run --config vitest.scheduled-native.config.ts src/games/scheduled/round-store.native.ts src/games/scheduled/stake-hold.native.ts src/games/economics/house-capital.native.ts
      - name: Generate disposable ledger test keys
        run: |
          python3 - <<'PYKEYS'
          import os, secrets
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              for name in ('SECURITY_TOTP_ENCRYPTION_KEY', 'LEDGER_APPROVAL_SIGNING_KEY'):
                  env.write(name + '=' + secrets.token_hex(32) + '\n')
              env.write('LEDGER_APPROVAL_KEY_ID=primary\n')
          PYKEYS
      - name: Existing ledger guard regressions
        env:
          TEST_LEDGER_DB_NAME: playqube_scheduled_throwaway
        run: >-
          pnpm --filter api exec vitest run
          src/ledger/allocator.contract.test.ts
          src/ledger/ledger-integrity-guards.contract.test.ts
          src/ledger/ledger-authorization-guards.contract.test.ts
          src/ledger/flows.contract.test.ts
      - name: Fresh and populated migration regression
        run: >-
          pnpm --filter api exec vitest run --config vitest.scheduled-native.config.ts
          src/ledger/ledger-upgrade.migration.test.ts
      - name: Isolated financial admission, draw, settlement and refund
        run: >-
          pnpm --filter api exec vitest run --config vitest.scheduled-native.config.ts
          src/games/economics/house-ticket.native.ts
          src/games/economics/house-settlement.native.ts
          src/games/economics/house-entropy.native.ts
          src/games/economics/house-recovery.native.ts
          src/games/economics/house-public-proof.native.ts
          src/games/economics/publication-store.native.ts
          src/games/economics/publication-submission.native.ts
      - name: Build API and probe offline CLI entry
        run: |
          pnpm --filter api exec node build.js
          PUB_CLI_PROBE=$(mktemp -d)
          trap 'rm -rf "$PUB_CLI_PROBE"' EXIT
          ln -s "$PWD/apps/api/dist/scripts/publication-receipt-verify.js" "$PUB_CLI_PROBE/verify.js"
          set +e
          node "$PUB_CLI_PROBE/verify.js" --file=/dev/null --commitment=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa > "$PUB_CLI_PROBE/result" 2>&1
          PUB_CLI_STATUS=$?
          set -e
          test "$PUB_CLI_STATUS" -eq 1
          test "$(cat "$PUB_CLI_PROBE/result")" = '{"status":"BLOCKED"}'

      - name: Scheduled practice web contracts
        run: >-
          pnpm --filter web exec vitest run
          src/pages/games/spin-win-scheduled.test.tsx
          src/pages/games/spin-win.test.tsx
          src/pages/games/spin-win-verify.test.tsx
          src/lib/spin-proof-verifier.test.ts
          src/lib/spin-publication-archive.test.ts
          --minWorkers=1 --maxWorkers=1
      - name: Build web and typecheck
        run: pnpm --filter web build
