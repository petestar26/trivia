name: Play Together contracts

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/play-together.yml'
      - 'apps/api/src/games/play-together/**'
      - 'apps/api/src/games/group-pvp/**'
      - 'apps/api/src/games/economics/**'
      - 'apps/api/src/economy/**'
      - 'apps/api/src/middleware/**'
      - 'apps/api/src/workspaces/**'
      - 'apps/api/src/member-rewards/**'
      - 'apps/api/src/auth/**'
      - 'apps/api/src/providers/softaggregator/**'
      - 'apps/api/src/server.ts'
      - 'apps/api/src/routes/index.ts'
      - 'apps/api/src/routes/groups.ts'
      - 'apps/api/vitest.together*.ts'
      - 'apps/web/src/**'
      - 'apps/web/vite.config.ts'
      - 'apps/web/pwa.test.mjs'
      - 'apps/web/app-recovery.test.mjs'
      - 'apps/web/index.html'
      - 'packages/shared/**'
      - 'packages/database/**'
      - 'scripts/check-together-catalogue-migration.mjs'
      - 'scripts/review-shared-game-capacity.mjs'
      - 'scripts/review-lobby-chat-visuals.mjs'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

jobs:
  capacity-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build the shared-game website
        run: |
          corepack enable
          corepack prepare pnpm@8.15.9 --activate
          pnpm install --frozen-lockfile
          pnpm --filter @socialplay/shared build
          pnpm --filter web build
      - name: Install the pinned browser test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/together-browser" --no-save --package-lock=false playwright@1.62.1
          node "$RUNNER_TEMP/together-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Game capacity, introductions and group chat
        run: |
          pnpm --filter web exec vite preview --host 127.0.0.1 --port 4181 --strictPort > "$RUNNER_TEMP/together-preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4181/ > /dev/null; then break; fi
            sleep 1
          done
          TOGETHER_REVIEW_ORIGIN=http://127.0.0.1:4181 \
          TOGETHER_REVIEW_OUTPUT="$RUNNER_TEMP/together-capacity" \
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/together-browser/node_modules/playwright" \
          node scripts/review-shared-game-capacity.mjs
          TOGETHER_REVIEW_ORIGIN=http://127.0.0.1:4181 \
          TOGETHER_REVIEW_OUTPUT="$RUNNER_TEMP/together-lobby-chat" \
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/together-browser/node_modules/playwright" \
          node scripts/review-lobby-chat-visuals.mjs
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-game-capacity
          path: |
            ${{ runner.temp }}/together-capacity
            ${{ runner.temp }}/together-lobby-chat
            ${{ runner.temp }}/together-preview.log
          retention-days: 7

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        postgres: [13, 16, 18]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-together-test-password
          POSTGRES_DB: playqube_scheduled_throwaway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:isolated-together-test-password@127.0.0.1:5432/playqube_scheduled_throwaway
      SCHEDULED_NATIVE_DB_ACK: throwaway
      NODE_ENV: test
      LOG_PRETTY: 'false'
      JWT_ACCESS_SECRET: isolated-together-ci-access-secret
      JWT_REFRESH_SECRET: isolated-together-ci-refresh-secret
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install locked dependencies and build shared packages
        run: |
          corepack enable
          corepack prepare pnpm@8.15.9 --activate
          pnpm install --frozen-lockfile
          pnpm build:packages
      - name: Apply migrations and verify replay
        run: |
          pnpm --filter @socialplay/database db:migrate:deploy
          pnpm --filter @socialplay/database db:migrate:deploy
      - name: Practice catalogue migration and administrator policy preservation
        run: node scripts/check-together-catalogue-migration.mjs
      - name: Group financial contracts and restricted runtime permissions
        run: pnpm --filter api exec vitest run --config vitest.together-native.config.ts
      - name: Existing group and sportsbook regressions
        run: |
          pnpm --filter api exec vitest run --config vitest.scheduled-native.config.ts src/games/group-pvp/group-pvp.native.ts
          pnpm --filter api exec vitest run --config vitest.sports-native.config.ts
      - name: Current Birr, administrator, agent and reward contracts
        run: |
          pnpm --filter api exec vitest run --config vitest.etb.config.ts
          pnpm --filter api exec vitest run --config vitest.staff-native.config.ts
          pnpm --filter api exec vitest run --config vitest.member-rewards.config.ts src/economy/reward-coins.native.ts
      - name: Rules, consent, proof and access checks
        if: matrix.postgres == 16
        run: |
          pnpm --filter @socialplay/shared exec vitest run src/play-together.test.ts src/together-game-guide.test.ts src/together-presentation.test.ts src/group-pvp.test.ts src/pvp-entry.test.ts --minWorkers=1 --maxWorkers=1
          pnpm --filter api exec vitest run --config vitest.together.config.ts
          pnpm --filter api test:scheduled-practice
          pnpm --filter web exec vitest run src/lib/together-proof.test.ts src/pages/play-together.test.tsx src/pages/play-together-selection.test.tsx src/components/together src/pages/messages.test.tsx src/components/football/football-scene.test.tsx src/components/groups/group-round-activity.test.tsx src/lib/member-game-catalog.test.ts src/pages/home.test.tsx src/app-game-sections.test.tsx src/pages/group-games.test.tsx --minWorkers=1 --maxWorkers=1
          pnpm --filter web exec vitest run src/lib/sky-crash-catalog.test.ts src/lib/football-catalog.test.ts src/lib/derby-catalog.test.ts src/lib/system-practice-catalog.test.ts src/lib/number-challenge-catalog.test.ts src/components/member/dashboard-highlights.test.tsx src/components/layout/mobile-navigation.test.tsx --minWorkers=1 --maxWorkers=1
      - name: Production builds
        if: matrix.postgres == 16
        env:
          NODE_ENV: production
        run: |
          pnpm build:api
          pnpm build:web
      - name: Interface languages and offline install
        if: matrix.postgres == 16
        run: |
          node apps/web/src/lib/i18n/tools/coverage.mjs --strict
          node --test apps/web/src/lib/i18n/tools/inventory.test.mjs
          pnpm --filter web exec vitest run src/lib/i18n src/providers/language-provider.test.tsx src/pages/member-language-state.test.tsx src/pages/public-language-select.test.tsx --minWorkers=1 --maxWorkers=1
          pnpm --filter web test:pwa
