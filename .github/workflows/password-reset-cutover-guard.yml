name: Password reset cutover guard

# Test the actual proposed commit, not GitHub's synthetic PR merge commit.
# No deployment job, production credentials, or external database is used.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/password-reset-cutover-guard.yml'
      - 'apps/api/**'
      - 'apps/web/server.mjs'
      - 'packages/**'
      - 'deploy/railway/api/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      NODE_ENV: test
      LOG_PRETTY: 'false'
      # Deliberately unreachable disposable URL; this suite must mock DB access.
      DATABASE_URL: postgresql://synthetic:synthetic@127.0.0.1:1/reset_guard_ci
      JWT_ACCESS_SECRET: synthetic-reset-guard-access-secret-not-production
      JWT_REFRESH_SECRET: synthetic-reset-guard-refresh-secret-not-production
    steps:
      # Match the repository's version-pinned action convention.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify and record exact tested source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          printf 'Guard tested commit: `%s`\n' "$EXPECTED_SHA" >> "$GITHUB_STEP_SUMMARY"
          git diff --check
      - name: Install frozen dependencies and build workspace packages
        run: |
          corepack enable
          corepack prepare pnpm@8.15.9 --activate
          pnpm install --frozen-lockfile
          pnpm build:packages
      - name: Validate guard configuration and exact 130-migration manifest
        run: node --test deploy/railway/api/reset-cutover-config.test.mjs
      - name: Direct API, gateway barrier and normal authentication regressions
        run: pnpm --filter api exec vitest run --config vitest.reset-cutover.config.ts
      - name: API typecheck and normal build
        run: |
          pnpm --filter api typecheck
          pnpm --filter api build
      - name: Verify source and lockfile were not rewritten
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --exit-code
          git diff --cached --exit-code
